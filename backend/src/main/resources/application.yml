spring:
  application:
    name: recipehub

  # PostgreSQL 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/recipehub
    driver-class-name: org.postgresql.Driver
    username: recipehub
    password: recipehub1234

  jpa:
    hibernate:
      ddl-auto: update   # 테이블 자동 생성/수정 (데이터 유지)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  cache:
    type: none

jwt:
  secret: recipehub-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000
  refresh-expiration: 604800000

server:
  port: 8080

logging:
  level:
    com.recipehub: DEBUG
    org.hibernate.SQL: DEBUG